sonar.projectKey=techcare
sonar.projectName=TechCare
sonar.sourceEncoding=UTF-8

# Código de producción y pruebas
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,android/**,ios/**,**/*.d.ts

# Cobertura generada por Jest (--coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx,src/**/*.d.ts

# Solo si usas SonarQube Cloud:
# sonar.organization=tu-organizacion
