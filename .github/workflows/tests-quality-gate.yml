name: Tests y Quality Gate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  unitarias-sonarqube:
    name: Unitarias + SonarQube + Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube necesita el historial completo

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test:unit -- --coverage

      # SonarQube Community Build no analiza Pull Requests: solo en push
      - name: SonarQube Scan
        if: github.event_name == 'push'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # debe ser accesible desde GitHub

      - name: Quality Gate (falla el pipeline si no pasa)
        if: github.event_name == 'push'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  integracion-api:
    name: Integración API REST (Supabase staging)
    needs: unitarias-sonarqube
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_TECNICO_EMAIL: ${{ secrets.TEST_TECNICO_EMAIL }}
      TEST_TECNICO_PASSWORD: ${{ secrets.TEST_TECNICO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:api

  # Aviso por webhook cuando falla cualquiera de los jobs anteriores
  notificar-falla:
    name: Notificar falla
    needs: [unitarias-sonarqube, integracion-api]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Enviar aviso a Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          msg=$(printf '❌ **Pipeline CI falló** · %s\nRama: %s · Autor: %s\n%s' "$REPO" "$BRANCH" "$ACTOR" "$RUN_URL")
          jq -n --arg msg "$msg" '{content: $msg}' \
            | curl -sS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
          # Slack: cambia {content: $msg} por {text: $msg} y usa el webhook de Slack