name: Tests y Quality Gate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  unitarias-sonarqube:
    name: Unitarias + SonarQube + Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube necesita el historial completo

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test:unit -- --coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7 # verifica la última versión en el Marketplace
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }} # debe ser accesible desde GitHub

      - name: Quality Gate (falla el pipeline si no pasa)
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  integracion-api:
    name: Integración API REST (Supabase staging)
    needs: unitarias-sonarqube
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_TECNICO_EMAIL: ${{ secrets.TEST_TECNICO_EMAIL }}
      TEST_TECNICO_PASSWORD: ${{ secrets.TEST_TECNICO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:api
